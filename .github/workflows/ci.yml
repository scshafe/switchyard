name: CI

# LIB-05. Generated by scshafe-dev; hosted runners only.
# Tags are owned by publish.yml; `branches` keeps tag pushes out of CI.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # The endpoints of package.json engines.node.
        node-version: [22.22.0, 24.18.0]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Installs @scshafe/graphpaper from GitHub Packages. Each package must
      # grant this repository read access ("Manage Actions access"), or the
      # install fails with 403; `dev grants switchyard` lists them.
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # pnpm/action-setup v6.1.0; the version comes from package.json packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # actions/setup-node v7.0.0. registry-url + scope write a user-level
      # npmrc ($RUNNER_TEMP) that maps @scshafe and reads NODE_AUTH_TOKEN.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@scshafe"
      - run: pnpm install --frozen-lockfile
      # typecheck, build, tests, payload manifest, pack-twice reproducibility +
      # tarball token/path scan, and the pack-and-install JS / TypeScript
      # smokes with the peers pinned as direct dependencies.
      - run: pnpm run verify
      - name: Fresh-clone check (install, build and verify a clone of HEAD)
        run: pnpm run test:fresh-clone
      # LIB-12e / D-17: no dependency-review action on a Free-plan private
      # repository; report production advisories without failing the build.
      - name: Audit production dependencies (non-blocking)
        continue-on-error: true
        run: pnpm audit --prod
