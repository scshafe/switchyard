name: CI

# Tags are owned by publish.yml; `branches` keeps tag pushes out of CI.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # The endpoints of package.json engines.node.
        node-version: [22.22.0, 24.18.0]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # pnpm/action-setup v6.1.0; the version comes from package.json packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - name: Fresh-clone check (install, build and verify a clone of HEAD)
        run: pnpm run test:fresh-clone
      # LIB-12e / D-17: no dependency-review action on a Free-plan private
      # repository; report production advisories without failing the build.
      - name: Audit production dependencies (non-blocking)
        continue-on-error: true
        run: pnpm audit --prod
